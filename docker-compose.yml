s   services:
     mongo:
       image: mongo:7
       container_name: raktsetu-mongo
       restart: unless-stopped
       volumes:
         - mongo_data:/data/db
       healthcheck:
         test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
         interval: 10s
         timeout: 5s
         retries: 5

     backend:
       build: ./backend
       container_name: raktsetu-backend
       env_file: ./backend/.env
       environment:
         MONGO_URI: mongodb://mongo:27017/raktsetu
       ports:
         - "5001:5001"
       depends_on:
         mongo:
           condition: service_healthy
       restart: unless-stopped

     frontend:
       build:
         context: ./client
         args:
           VITE_API_URL: http://localhost:5001
       container_name: raktsetu-frontend
       ports:
         - "5173:80"
       depends_on:
         - backend
       restart: unless-stopped

   volumes:
     mongo_data: